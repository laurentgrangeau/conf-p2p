<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 185" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c233a" />
      <stop offset="100%" stop-color="#081626" />
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09281c" />
      <stop offset="100%" stop-color="#061912" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1f0b" />
      <stop offset="100%" stop-color="#1a1206" />
    </linearGradient>
    <linearGradient id="redBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f111d" />
      <stop offset="100%" stop-color="#1c0911" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241338" />
      <stop offset="100%" stop-color="#140a21" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <style>
      .title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; fill: #f8fafc; }
      .mono { font-family: 'JetBrains Mono', monospace; fill: #e2e8f0; }
      .label { font-family: 'Inter', sans-serif; fill: #cbd5e1; }
      .muted { font-family: 'Inter', sans-serif; fill: #94a3b8; }
      .cyan { fill: #38bdf8; }
      .green { fill: #22c55e; }
      .amber { fill: #f59e0b; }
      .red { fill: #f43f5e; }
      .purple { fill: #c084fc; }
    </style>
  </defs>

  <rect width="520" height="185" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Peer A -->
  <rect x="14" y="48" width="96" height="84" rx="8" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="2"/>
  <text x="62" y="84" text-anchor="middle" class="title cyan" font-size="14">Peer A</text>
  <text x="62" y="104" text-anchor="middle" class="mono muted" font-size="10">I2PSnark</text>

  <!-- Outbound Tunnel Top -->
  <rect x="155" y="20" width="210" height="46" rx="7" fill="url(#purpleBox)" stroke="#c084fc" stroke-width="1.8"/>
  <text x="260" y="40" text-anchor="middle" class="mono purple" font-size="11.5" font-weight="bold">Outbound ──► Inbound Tunnel</text>
  <text x="260" y="56" text-anchor="middle" class="mono amber" font-size="10">🧄 Garlic Bulb [Clove1 | Clove2 | Clove3]</text>

  <!-- Inbound Tunnel Bottom -->
  <rect x="155" y="114" width="210" height="46" rx="7" fill="url(#greenBox)" stroke="#22c55e" stroke-width="1.8"/>
  <text x="260" y="134" text-anchor="middle" class="mono green" font-size="11.5" font-weight="bold">Inbound ◄── Outbound Tunnel</text>
  <text x="260" y="150" text-anchor="middle" class="mono muted" font-size="10">Separate Return Relay Hop Chain!</text>

  <!-- Peer B -->
  <rect x="410" y="48" width="96" height="84" rx="8" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="2"/>
  <text x="458" y="84" text-anchor="middle" class="title cyan" font-size="14">Peer B</text>
  <text x="458" y="104" text-anchor="middle" class="mono muted" font-size="10">Hidden IP</text>

  <!-- Arrows -->
  <line x1="110" y1="66" x2="150" y2="44" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arrowPurple)"/>
  <line x1="365" y1="44" x2="405" y2="66" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arrowPurple)"/>

  <line x1="410" y1="114" x2="370" y2="136" stroke="#22c55e" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <line x1="155" y1="136" x2="115" y2="114" stroke="#22c55e" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

</svg>
