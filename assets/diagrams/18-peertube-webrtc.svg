<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 185" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c233a" />
      <stop offset="100%" stop-color="#081626" />
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09281c" />
      <stop offset="100%" stop-color="#061912" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1f0b" />
      <stop offset="100%" stop-color="#1a1206" />
    </linearGradient>
    <linearGradient id="redBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f111d" />
      <stop offset="100%" stop-color="#1c0911" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241338" />
      <stop offset="100%" stop-color="#140a21" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <style>
      .title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; fill: #f8fafc; }
      .mono { font-family: 'JetBrains Mono', monospace; fill: #e2e8f0; }
      .label { font-family: 'Inter', sans-serif; fill: #cbd5e1; }
      .muted { font-family: 'Inter', sans-serif; fill: #94a3b8; }
      .cyan { fill: #38bdf8; }
      .green { fill: #22c55e; }
      .amber { fill: #f59e0b; }
      .red { fill: #f43f5e; }
      .purple { fill: #c084fc; }
    </style>
  </defs>

  <rect width="520" height="185" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Origin CDN -->
  <rect x="155" y="14" width="210" height="50" rx="8" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="260" y="36" text-anchor="middle" class="title amber" font-size="13.5">Origin / HLS Video Server</text>
  <text x="260" y="53" text-anchor="middle" class="mono muted" font-size="10">Seeds initial .m4s / .ts chunks</text>

  <!-- Arrows from CDN -->
  <line x1="210" y1="64" x2="115" y2="108" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>
  <line x1="310" y1="64" x2="405" y2="108" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>

  <!-- Browser Peer 1 -->
  <rect x="18" y="112" width="165" height="56" rx="8" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="2"/>
  <text x="100" y="137" text-anchor="middle" class="title cyan" font-size="13">Browser Peer 1</text>
  <text x="100" y="155" text-anchor="middle" class="mono muted" font-size="10">Firefox Tab (Viewer)</text>

  <!-- Browser Peer 2 -->
  <rect x="337" y="112" width="165" height="56" rx="8" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="2"/>
  <text x="419" y="137" text-anchor="middle" class="title cyan" font-size="13">Browser Peer 2</text>
  <text x="419" y="155" text-anchor="middle" class="mono muted" font-size="10">Chrome Tab (Viewer)</text>

  <!-- WebRTC DataChannel -->
  <line x1="188" y1="140" x2="332" y2="140" stroke="#22c55e" stroke-width="3" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <text x="260" y="128" text-anchor="middle" class="mono green" font-size="11" font-weight="bold">WebRTC P2P Swarm</text>
  <text x="260" y="160" text-anchor="middle" class="mono muted" font-size="9.5">Shares .m4s video chunks!</text>

</svg>
