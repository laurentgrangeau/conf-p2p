<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c233a" />
      <stop offset="100%" stop-color="#081626" />
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09281c" />
      <stop offset="100%" stop-color="#061912" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1f0b" />
      <stop offset="100%" stop-color="#1a1206" />
    </linearGradient>
    <linearGradient id="redBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f111d" />
      <stop offset="100%" stop-color="#1c0911" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241338" />
      <stop offset="100%" stop-color="#140a21" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <style>
      .title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; fill: #f8fafc; }
      .mono { font-family: 'JetBrains Mono', monospace; fill: #e2e8f0; }
      .label { font-family: 'Inter', sans-serif; fill: #cbd5e1; }
      .muted { font-family: 'Inter', sans-serif; fill: #94a3b8; }
      .cyan { fill: #38bdf8; }
      .green { fill: #22c55e; }
      .amber { fill: #f59e0b; }
      .red { fill: #f43f5e; }
      .purple { fill: #c084fc; }
    </style>
  </defs>

  <rect width="560" height="210" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Supernodes -->
  <rect x="42" y="20" width="180" height="58" rx="8" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="2.2"/>
  <text x="132" y="45" text-anchor="middle" class="title cyan" font-size="15">SUPERNODE 1</text>
  <text x="132" y="64" text-anchor="middle" class="mono muted" font-size="11">Broadband • Public IP</text>

  <rect x="338" y="20" width="180" height="58" rx="8" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="2.2"/>
  <text x="428" y="45" text-anchor="middle" class="title cyan" font-size="15">SUPERNODE 2</text>
  <text x="428" y="64" text-anchor="middle" class="mono muted" font-size="11">University Fiber • Fast CPU</text>

  <!-- Mesh Link -->
  <line x1="226" y1="49" x2="332" y2="49" stroke="#22c55e" stroke-width="3" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <text x="280" y="38" text-anchor="middle" class="mono green" font-size="11" font-weight="bold">Gossip &amp; Queries</text>

  <!-- Leaf nodes left -->
  <line x1="85" y1="78" x2="55" y2="138" stroke="#64748b" stroke-width="1.6"/>
  <line x1="132" y1="78" x2="132" y2="138" stroke="#64748b" stroke-width="1.6"/>
  <line x1="179" y1="78" x2="209" y2="138" stroke="#64748b" stroke-width="1.6"/>

  <rect x="20" y="140" width="70" height="44" rx="6" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="55" y="160" text-anchor="middle" class="mono" font-size="12">Leaf p1</text>
  <text x="55" y="175" text-anchor="middle" class="mono muted" font-size="9.5">56k Modem</text>

  <rect x="97" y="140" width="70" height="44" rx="6" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="132" y="160" text-anchor="middle" class="mono" font-size="12">Leaf p2</text>
  <text x="132" y="175" text-anchor="middle" class="mono muted" font-size="9.5">Home NAT</text>

  <rect x="174" y="140" width="70" height="44" rx="6" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="209" y="160" text-anchor="middle" class="mono" font-size="12">Leaf p3</text>
  <text x="209" y="175" text-anchor="middle" class="mono muted" font-size="9.5">56k Modem</text>

  <!-- Leaf nodes right -->
  <line x1="381" y1="78" x2="351" y2="138" stroke="#64748b" stroke-width="1.6"/>
  <line x1="428" y1="78" x2="428" y2="138" stroke="#64748b" stroke-width="1.6"/>
  <line x1="475" y1="78" x2="505" y2="138" stroke="#64748b" stroke-width="1.6"/>

  <rect x="316" y="140" width="70" height="44" rx="6" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="351" y="160" text-anchor="middle" class="mono" font-size="12">Leaf p4</text>
  <text x="351" y="175" text-anchor="middle" class="mono muted" font-size="9.5">ADSL / NAT</text>

  <rect x="393" y="140" width="70" height="44" rx="6" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="428" y="160" text-anchor="middle" class="mono" font-size="12">Leaf p5</text>
  <text x="428" y="175" text-anchor="middle" class="mono muted" font-size="9.5">Firewall</text>

  <rect x="470" y="140" width="70" height="44" rx="6" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="505" y="160" text-anchor="middle" class="mono" font-size="12">Leaf p6</text>
  <text x="505" y="175" text-anchor="middle" class="mono muted" font-size="9.5">ADSL / NAT</text>

</svg>
