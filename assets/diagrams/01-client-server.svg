<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c233a" />
      <stop offset="100%" stop-color="#081626" />
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09281c" />
      <stop offset="100%" stop-color="#061912" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1f0b" />
      <stop offset="100%" stop-color="#1a1206" />
    </linearGradient>
    <linearGradient id="redBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f111d" />
      <stop offset="100%" stop-color="#1c0911" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241338" />
      <stop offset="100%" stop-color="#140a21" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <style>
      .title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; fill: #f8fafc; }
      .mono { font-family: 'JetBrains Mono', monospace; fill: #e2e8f0; }
      .label { font-family: 'Inter', sans-serif; fill: #cbd5e1; }
      .muted { font-family: 'Inter', sans-serif; fill: #94a3b8; }
      .cyan { fill: #38bdf8; }
      .green { fill: #22c55e; }
      .amber { fill: #f59e0b; }
      .red { fill: #f43f5e; }
      .purple { fill: #c084fc; }
    </style>
  </defs>

  <rect width="560" height="230" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Central Server -->
  <rect x="145" y="16" width="270" height="62" rx="8" fill="url(#redBox)" stroke="#f43f5e" stroke-width="2"/>
  <text x="280" y="42" text-anchor="middle" class="title" font-size="15">CENTRAL HTTP / FTP SERVER</text>
  <text x="280" y="64" text-anchor="middle" class="mono red" font-size="12">Shared 10 Mbps Uplink Bottleneck</text>

  <!-- Bottleneck Arrows -->
  <line x1="210" y1="78" x2="75" y2="138" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <line x1="255" y1="78" x2="205" y2="138" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <line x1="305" y1="78" x2="345" y2="138" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <line x1="350" y1="78" x2="485" y2="138" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>

  <!-- Peers -->
  <rect x="20" y="144" width="110" height="46" rx="6" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="75" y="167" text-anchor="middle" class="mono" font-size="13">Peer 1</text>
  <text x="75" y="182" text-anchor="middle" class="mono amber" font-size="10">~1 kbps</text>

  <rect x="150" y="144" width="110" height="46" rx="6" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="205" y="167" text-anchor="middle" class="mono" font-size="13">Peer 2</text>
  <text x="205" y="182" text-anchor="middle" class="mono amber" font-size="10">~1 kbps</text>

  <rect x="290" y="144" width="110" height="46" rx="6" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="345" y="167" text-anchor="middle" class="mono" font-size="13">Peer 3</text>
  <text x="345" y="182" text-anchor="middle" class="mono amber" font-size="10">~1 kbps</text>

  <rect x="425" y="144" width="115" height="46" rx="6" fill="url(#redBox)" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="482" y="167" text-anchor="middle" class="mono" font-size="12">Peer 10,000</text>
  <text x="482" y="182" text-anchor="middle" class="mono red" font-size="10">HTTP 503 / Timeout</text>

  <text x="280" y="214" text-anchor="middle" class="mono amber" font-size="12">Bandwidth per user = Uplink / N  ──►  Collapses as N grows!</text>

</svg>
