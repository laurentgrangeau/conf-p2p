<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c233a" />
      <stop offset="100%" stop-color="#081626" />
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09281c" />
      <stop offset="100%" stop-color="#061912" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1f0b" />
      <stop offset="100%" stop-color="#1a1206" />
    </linearGradient>
    <linearGradient id="redBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f111d" />
      <stop offset="100%" stop-color="#1c0911" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241338" />
      <stop offset="100%" stop-color="#140a21" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <style>
      .title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; fill: #f8fafc; }
      .mono { font-family: 'JetBrains Mono', monospace; fill: #e2e8f0; }
      .label { font-family: 'Inter', sans-serif; fill: #cbd5e1; }
      .muted { font-family: 'Inter', sans-serif; fill: #94a3b8; }
      .cyan { fill: #38bdf8; }
      .green { fill: #22c55e; }
      .amber { fill: #f59e0b; }
      .red { fill: #f43f5e; }
      .purple { fill: #c084fc; }
    </style>
  </defs>

  <rect width="520" height="180" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Laptop -->
  <rect x="16" y="24" width="155" height="62" rx="7" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="2"/>
  <text x="93" y="49" text-anchor="middle" class="title cyan" font-size="13">Roaming Laptop</text>
  <text x="93" y="68" text-anchor="middle" class="mono muted" font-size="10">Behind Hotel NAT</text>

  <!-- Firewalls -->
  <rect x="192" y="18" width="14" height="74" rx="3" fill="#f43f5e"/>
  <rect x="314" y="18" width="14" height="74" rx="3" fill="#f43f5e"/>
  <text x="260" y="34" text-anchor="middle" class="mono red" font-size="10" font-weight="bold">NAT Firewalls</text>

  <!-- Home NAS -->
  <rect x="349" y="24" width="155" height="62" rx="7" fill="url(#greenBox)" stroke="#22c55e" stroke-width="2"/>
  <text x="426" y="49" text-anchor="middle" class="title green" font-size="13">Home Lab NAS</text>
  <text x="426" y="68" text-anchor="middle" class="mono muted" font-size="10">Behind ISP Box NAT</text>

  <!-- Simultaneous UDP Punch -->
  <line x1="173" y1="55" x2="344" y2="55" stroke="#22c55e" stroke-width="3" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>

  <rect x="28" y="108" width="464" height="54" rx="7" fill="#090d16" stroke="#22c55e" stroke-width="1.3"/>
  <text x="260" y="130" text-anchor="middle" class="mono green" font-size="11.5" font-weight="bold">Simultaneous Outbound UDP Packets Punch State Holes!</text>
  <text x="260" y="148" text-anchor="middle" class="mono muted" font-size="10.5">Direct encrypted WireGuard P2P tunnel (Zero manual port-forwarding)</text>

</svg>
