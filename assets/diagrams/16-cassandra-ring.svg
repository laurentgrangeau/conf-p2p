<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c233a" />
      <stop offset="100%" stop-color="#081626" />
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09281c" />
      <stop offset="100%" stop-color="#061912" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1f0b" />
      <stop offset="100%" stop-color="#1a1206" />
    </linearGradient>
    <linearGradient id="redBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f111d" />
      <stop offset="100%" stop-color="#1c0911" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241338" />
      <stop offset="100%" stop-color="#140a21" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <style>
      .title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; fill: #f8fafc; }
      .mono { font-family: 'JetBrains Mono', monospace; fill: #e2e8f0; }
      .label { font-family: 'Inter', sans-serif; fill: #cbd5e1; }
      .muted { font-family: 'Inter', sans-serif; fill: #94a3b8; }
      .cyan { fill: #38bdf8; }
      .green { fill: #22c55e; }
      .amber { fill: #f59e0b; }
      .red { fill: #f43f5e; }
      .purple { fill: #c084fc; }
    </style>
  </defs>

  <rect width="500" height="210" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ring Circle -->
  <circle cx="250" cy="105" r="68" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Gossip cross-arrows -->
  <line x1="205" y1="62" x2="295" y2="148" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="4,3" marker-start="url(#arrowPurple)" marker-end="url(#arrowPurple)"/>
  <line x1="295" y1="62" x2="205" y2="148" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="4,3" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>

  <!-- Node A (Top) -->
  <rect x="175" y="10" width="150" height="34" rx="6" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="250" y="32" text-anchor="middle" class="mono cyan" font-size="11.5" font-weight="bold">Node A (0x00..)</text>

  <!-- Node B (Right) -->
  <rect x="335" y="88" width="148" height="34" rx="6" fill="url(#greenBox)" stroke="#22c55e" stroke-width="1.8"/>
  <text x="409" y="110" text-anchor="middle" class="mono green" font-size="11.5" font-weight="bold">Node B (0x40..)</text>

  <!-- Node C (Bottom) -->
  <rect x="175" y="166" width="150" height="34" rx="6" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="250" y="188" text-anchor="middle" class="mono amber" font-size="11.5" font-weight="bold">Node C (0x80..)</text>

  <!-- Node D (Left) -->
  <rect x="17" y="88" width="148" height="34" rx="6" fill="url(#purpleBox)" stroke="#c084fc" stroke-width="1.8"/>
  <text x="91" y="110" text-anchor="middle" class="mono purple" font-size="11.5" font-weight="bold">Node D (0xC0..)</text>

  <rect x="195" y="93" width="110" height="24" rx="4" fill="#090d16"/>
  <text x="250" y="109" text-anchor="middle" class="mono purple" font-size="10.5" font-weight="bold">1s P2P Gossip</text>

</svg>
