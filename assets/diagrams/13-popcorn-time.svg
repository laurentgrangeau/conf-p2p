<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 175" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c233a" />
      <stop offset="100%" stop-color="#081626" />
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09281c" />
      <stop offset="100%" stop-color="#061912" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1f0b" />
      <stop offset="100%" stop-color="#1a1206" />
    </linearGradient>
    <linearGradient id="redBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f111d" />
      <stop offset="100%" stop-color="#1c0911" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241338" />
      <stop offset="100%" stop-color="#140a21" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <style>
      .title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; fill: #f8fafc; }
      .mono { font-family: 'JetBrains Mono', monospace; fill: #e2e8f0; }
      .label { font-family: 'Inter', sans-serif; fill: #cbd5e1; }
      .muted { font-family: 'Inter', sans-serif; fill: #94a3b8; }
      .cyan { fill: #38bdf8; }
      .green { fill: #22c55e; }
      .amber { fill: #f59e0b; }
      .red { fill: #f43f5e; }
      .purple { fill: #c084fc; }
    </style>
  </defs>

  <rect width="520" height="175" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Standard BitTorrent -->
  <text x="20" y="32" class="mono muted" font-size="12" font-weight="bold">Standard BitTorrent (Rarest-First):</text>
  <rect x="20" y="42" width="105" height="34" rx="5" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="72" y="64" text-anchor="middle" class="mono amber" font-size="12">Piece #42</text>

  <rect x="135" y="42" width="105" height="34" rx="5" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="187" y="64" text-anchor="middle" class="mono amber" font-size="12">Piece #7</text>

  <rect x="250" y="42" width="105" height="34" rx="5" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="302" y="64" text-anchor="middle" class="mono amber" font-size="12">Piece #99</text>

  <rect x="365" y="42" width="135" height="34" rx="5" fill="url(#redBox)" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="432" y="63" text-anchor="middle" class="mono red" font-size="11">Can't Play Yet!</text>

  <!-- Popcorn Time -->
  <text x="20" y="106" class="mono cyan" font-size="12" font-weight="bold">Popcorn Time (Sequential Sliding Window):</text>
  <rect x="20" y="116" width="82" height="36" rx="5" fill="url(#greenBox)" stroke="#22c55e" stroke-width="2"/>
  <text x="61" y="139" text-anchor="middle" class="mono green" font-size="12" font-weight="bold">▶ #1</text>

  <rect x="110" y="116" width="82" height="36" rx="5" fill="url(#greenBox)" stroke="#22c55e" stroke-width="2"/>
  <text x="151" y="139" text-anchor="middle" class="mono green" font-size="12" font-weight="bold">▶ #2</text>

  <rect x="200" y="116" width="82" height="36" rx="5" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="2"/>
  <text x="241" y="139" text-anchor="middle" class="mono cyan" font-size="12" font-weight="bold">▶ #3</text>

  <rect x="292" y="116" width="208" height="36" rx="5" fill="url(#purpleBox)" stroke="#c084fc" stroke-width="1.6"/>
  <text x="396" y="138" text-anchor="middle" class="mono purple" font-size="11">+ Rarest-First Ahead!</text>

</svg>
