  <text x="507" y="190" text-anchor="middle" class="mono amber" font-size="11.5">Chunk 1 (256 KB)</text>
  <text x="507" y="204" text-anchor="middle" class="mono muted" font-size="10">CID: bafk...01</text>

  <rect x="630" y="172" width="205" height="40" rx="6" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.5"/>
