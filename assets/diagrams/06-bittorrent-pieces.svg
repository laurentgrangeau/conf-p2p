<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 125" width="100%" height="100%">

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c233a" />
      <stop offset="100%" stop-color="#081626" />
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09281c" />
      <stop offset="100%" stop-color="#061912" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1f0b" />
      <stop offset="100%" stop-color="#1a1206" />
    </linearGradient>
    <linearGradient id="redBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f111d" />
      <stop offset="100%" stop-color="#1c0911" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241338" />
      <stop offset="100%" stop-color="#140a21" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <style>
      .title { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; fill: #f8fafc; }
      .mono { font-family: 'JetBrains Mono', monospace; fill: #e2e8f0; }
      .label { font-family: 'Inter', sans-serif; fill: #cbd5e1; }
      .muted { font-family: 'Inter', sans-serif; fill: #94a3b8; }
      .cyan { fill: #38bdf8; }
      .green { fill: #22c55e; }
      .amber { fill: #f59e0b; }
      .red { fill: #f43f5e; }
      .purple { fill: #c084fc; }
    </style>
  </defs>

  <rect width="880" height="125" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- File -->
  <rect x="18" y="22" width="215" height="80" rx="8" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="2"/>
  <text x="125" y="54" text-anchor="middle" class="title amber" font-size="16">Ubuntu.iso (1 GB)</text>
  <text x="125" y="78" text-anchor="middle" class="mono muted" font-size="12">Single Swarm Target</text>

  <line x1="233" y1="62" x2="292" y2="62" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- Pieces -->
  <rect x="298" y="22" width="265" height="80" rx="8" fill="url(#cyanBox)" stroke="#38bdf8" stroke-width="2"/>
  <text x="430" y="50" text-anchor="middle" class="title cyan" font-size="15">4,096 Pieces (256 KB each)</text>
  <text x="430" y="72" text-anchor="middle" class="mono" font-size="11.5">Verified via SHA-1 in .torrent</text>
  <text x="430" y="90" text-anchor="middle" class="mono green" font-size="10.5">[#0] [#1] [#2] ... [#4095]</text>

  <line x1="563" y1="62" x2="622" y2="62" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Blocks -->
  <rect x="628" y="22" width="234" height="80" rx="8" fill="url(#greenBox)" stroke="#22c55e" stroke-width="2"/>
  <text x="745" y="50" text-anchor="middle" class="title green" font-size="15">16 KB Sub-Blocks</text>
  <text x="745" y="72" text-anchor="middle" class="mono" font-size="11.5">16 Blocks per 256 KB Piece</text>
  <text x="745" y="90" text-anchor="middle" class="mono muted" font-size="10.5">Pipelined in parallel over TCP</text>

</svg>
